<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林诗涵 · 剧情分镜CG图库 - 巴蜀中学竞赛班模拟器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #1a0a1a, #0d050d);
  min-height: 100vh;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  color: #fff;
  overflow-x: hidden;
}

/* Header */
.header {
  text-align: center;
  padding: 40px 20px 20px;
  position: relative;
}
.header h1 {
  font-size: 2em;
  font-weight: 300;
  letter-spacing: 0.2em;
  color: #ffb6c1;
  margin-bottom: 8px;
}
.header .subtitle {
  color: rgba(255,255,255,0.5);
  font-size: 0.95em;
  margin-bottom: 8px;
}
.header .chapter-title {
  color: rgba(255,182,193,0.7);
  font-size: 1.1em;
  font-style: italic;
}

/* Cherry blossom particles */
.petal {
  position: fixed;
  width: 12px;
  height: 12px;
  background: linear-gradient(135deg, #ffb6c1, #ff69b4);
  border-radius: 50% 0 50% 50%;
  pointer-events: none;
  opacity: 0.6;
  animation: petalFall linear infinite;
  z-index: 1;
}
@keyframes petalFall {
  0% { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 0.6; }
  100% { transform: translateY(100vh) rotate(360deg) translateX(50px); opacity: 0; }
}

/* Gallery Grid */
.gallery-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
  z-index: 2;
}
.scene-card {
  display: flex;
  gap: 24px;
  margin-bottom: 40px;
  padding: 24px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,182,193,0.1);
  border-radius: 16px;
  transition: all 0.4s ease;
  opacity: 0;
  transform: translateY(30px);
}
.scene-card.visible {
  opacity: 1;
  transform: translateY(0);
}
.scene-card:hover {
  background: rgba(255,182,193,0.05);
  border-color: rgba(255,182,193,0.3);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(255,107,157,0.15);
}
.scene-card:nth-child(even) {
  flex-direction: row-reverse;
}
.scene-image {
  flex: 0 0 480px;
  height: 270px;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}
.scene-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}
.scene-image:hover img {
  transform: scale(1.08);
}
.scene-image .scene-number {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.6);
  color: #ffb6c1;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8em;
  font-weight: 600;
}
.scene-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.scene-info .scene-title {
  font-size: 1.3em;
  color: #ffb6c1;
  margin-bottom: 8px;
  font-weight: 500;
}
.scene-info .scene-desc {
  color: rgba(255,255,255,0.7);
  line-height: 1.8;
  font-size: 0.95em;
}
.scene-info .scene-quote {
  margin-top: 12px;
  padding: 12px 16px;
  background: rgba(255,182,193,0.08);
  border-left: 3px solid #ff6b9d;
  border-radius: 0 8px 8px 0;
  color: rgba(255,255,255,0.8);
  font-style: italic;
  font-size: 0.9em;
}

/* Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.lightbox.active {
  display: flex;
}
.lightbox img {
  max-width: 90vw;
  max-height: 75vh;
  border-radius: 8px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.lightbox .lightbox-info {
  margin-top: 20px;
  text-align: center;
  color: rgba(255,255,255,0.8);
}
.lightbox .lightbox-info h3 {
  color: #ffb6c1;
  font-size: 1.2em;
  margin-bottom: 4px;
}
.lightbox .nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 1.5em;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lightbox .nav-btn:hover {
  background: rgba(255,182,193,0.2);
  border-color: #ffb6c1;
}
.lightbox .nav-btn.prev { left: 20px; }
.lightbox .nav-btn.next { right: 20px; }
.lightbox .close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  font-size: 1.2em;
  cursor: pointer;
  transition: all 0.3s;
}
.lightbox .close-btn:hover {
  background: rgba(255,107,157,0.3);
  border-color: #ff6b9d;
}

/* Progress bar */
.progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, #ff6b9d, #ffb6c1);
  width: 0%;
  z-index: 100;
  transition: width 0.3s;
}

/* Responsive */
@media (max-width: 900px) {
  .scene-card, .scene-card:nth-child(even) {
    flex-direction: column;
  }
  .scene-image {
    flex: none;
    width: 100%;
    height: 200px;
  }
}
</style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<div class="header">
  <h1>林诗涵 · 剧情分镜CG图库</h1>
  <div class="subtitle">巴蜀中学竞赛班模拟器 · 专属剧情画廊</div>
  <div class="chapter-title">"你是我诗中最美的韵脚"</div>
</div>

<div class="gallery-container" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <button class="close-btn" onclick="closeLightbox()">&times;</button>
  <button class="nav-btn prev" onclick="navigate(-1)">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-info" id="lightboxInfo"></div>
  <button class="nav-btn next" onclick="navigate(1)">&#8250;</button>
</div>

  { img: 'scene_03_painting_class.jpg', title: 'Scene 03 · 画室时光', desc: '她专注地在画布上涂抹色彩，颜料沾满了指尖，却浑然不觉。', quote: '「你的每一笔，都在我心里画下了痕迹。」' },

  { img: 'scene_29_park_date.jpg', title: 'Scene 29 · 公园约会', desc: '公园的长椅上，她分享着冰淇淋，阳光洒在她的侧脸。', quote: '「要尝一口吗？」' },
  { img: 'scene_30_wedding_dream.jpg', title: 'Scene 30 · 梦中婚礼', desc: '梦中的她穿着婚纱，站在花海中，向你伸出手。', quote: '「如果有一天...能和你一起。」' },
  { img: 'scene_31_rainy_day.jpg', title: 'Scene 31 · 雨天午后', desc: '雨天的窗边，她捧着热茶，望着窗外的雨景， sketchbook放在一旁。', quote: '「下雨天...最适合画画了。」' },

let currentIndex = 0;

function createGallery() {
  const container = document.getElementById('gallery');
  SCENES.forEach((scene, i) => {
    const card = document.createElement('div');
    card.className = 'scene-card';
    card.innerHTML = `
      <div class="scene-image" onclick="openLightbox(${i})">
        <img src="${scene.img}" alt="${scene.title}" loading="lazy">
        <div class="scene-number">${String(i+1).padStart(2,'0')}</div>
      </div>
      <div class="scene-info">
        <div class="scene-title">${scene.title}</div>
        <div class="scene-desc">${scene.desc}</div>
        <div class="scene-quote">${scene.quote}</div>
      </div>
    `;
    container.appendChild(card);
  });

  // Intersection Observer for scroll animations
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.scene-card').forEach(card => observer.observe(card));
}

function openLightbox(index) {
  currentIndex = index;
  const lightbox = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  const info = document.getElementById('lightboxInfo');
  img.src = SCENES[index].img;
  info.innerHTML = `<h3>${SCENES[index].title}</h3><p>${SCENES[index].desc}</p>`;
  lightbox.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
  document.body.style.overflow = '';
}

function navigate(dir) {
  currentIndex = (currentIndex + dir + SCENES.length) % SCENES.length;
  const img = document.getElementById('lightboxImg');
  const info = document.getElementById('lightboxInfo');
  img.style.opacity = '0';
  setTimeout(() => {
    img.src = SCENES[currentIndex].img;
    info.innerHTML = `<h3>${SCENES[currentIndex].title}</h3><p>${SCENES[currentIndex].desc}</p>`;
    img.style.opacity = '1';
  }, 200);
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

// Scroll progress
window.addEventListener('scroll', () => {
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const progress = (scrollTop / docHeight) * 100;
  document.getElementById('progressBar').style.width = progress + '%';
});

// Create falling petals
function createPetals() {
  for (let i = 0; i < 20; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.style.left = Math.random() * 100 + 'vw';
    petal.style.animationDelay = Math.random() * 8 + 's';
    petal.style.animationDuration = (6 + Math.random() * 6) + 's';
    petal.style.width = (8 + Math.random() * 8) + 'px';
    petal.style.height = petal.style.width;
    document.body.appendChild(petal);
  }
}

createGallery();
createPetals();
</script>

</body>
</html>
